<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>SoufflePet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }

  #err {
    display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.95); border: 1px solid #e88;
    border-radius: 8px; padding: 6px 12px; font-size: 12px; color: #c33; z-index: 9;
  }

  /* 右上角帧率叠加层：与原生版样式一致（半透明黑底白字），不拦截鼠标 */
  #fps {
    display: none; position: fixed; top: 6px; right: 10px; z-index: 8;
    background: rgba(0, 0, 0, 0.43); border-radius: 4px; padding: 2px 6px;
    color: #fff; font-size: 12px; pointer-events: none;
  }

  /* 右键交互菜单：渲染在页面内的 HTML 菜单（配色对齐对话窗口的深色玻璃面板）。
     不用宿主 Avalonia 菜单：WebView2 用子 HWND 承载页面，同一窗口内的 Avalonia
     弹出层会被它遮挡（airspace），页面内菜单不受影响。 */
  #menu {
    display: none; position: fixed; z-index: 20; min-width: 96px;
    max-height: 70vh; overflow-y: auto;
    background: rgba(23, 24, 29, 0.92); border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: 8px; padding: 4px; color: rgba(255, 255, 255, 0.95);
    font-size: 13px; user-select: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
  #menu .item { padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  #menu .item:hover { background: rgba(255, 255, 255, 0.16); }
  /* 分组标题（表情 / 动作）：不可点击，只做分隔 */
  #menu .header { padding: 6px 12px 2px; color: rgba(255, 255, 255, 0.5); font-size: 12px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="fps"></div>
  <div id="err"></div>
  <div id="menu"></div>

  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

<script>
// 模型地址由宿主通过查询参数传入（SoufflePet.json 的 ModelsDirectory / Live2DModels），
// 直接打开页面（无参数）时回退到默认模型
const params = new URLSearchParams(location.search);
const MODEL_URL = params.get('model') || 'models/舒芙蕾/舒芙蕾.model3.json';
const CDI_URL = MODEL_URL.replace(/\.model3\.json$/, '.cdi3.json');
// 模型列表与当前下标（右键菜单里的「切换模型」），由宿主传入；切换时宿主重开页面
const MODELS = (() => { try { return JSON.parse(params.get('models') || '[]'); } catch (_) { return []; } })();
const ACTIVE_MODEL = Number.parseInt(params.get('active') || '0', 10) || 0;
// 水印部件 Id 因模型而异，由宿主按模型配置传入；留空表示不处理水印
const WATERMARK_PART = params.get('watermark') || '';
const EXPRESSIONS = ['哭哭', '手柄', '星星', '水印', '爱心', '猫猫手', '生气', '眼罩', '眼镜', '脸红', '麦克风', '黑脸'];

const errEl = document.getElementById('err');
function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }

// 向宿主（Avalonia）发消息；普通浏览器里调试时该函数不存在
function tellHost(obj) {
  if (typeof invokeCSharpAction === 'function') {
    try { invokeCSharpAction(JSON.stringify(obj)); } catch (e) { /* ignore */ }
  }
}

async function main() {
  if (!window.PIXI || !PIXI.live2d) throw new Error('CDN 脚本加载失败，请检查网络');
  PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);

  // resolution = devicePixelRatio：按物理像素光栅化，避免高 DPI 下拉伸发糊
  // preserveDrawingBuffer：允许每帧读 1 个像素做命中检测（点击穿透判定），开销可忽略
  const app = new PIXI.Application({
    resizeTo: window,
    backgroundAlpha: 0,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
    preserveDrawingBuffer: true,
  });
  document.getElementById('stage').appendChild(app.view);
  app.stage.interactive = true;

  // 帧率显示：不限帧（maxFPS=0 交给浏览器 RAF / 显示器刷新率），只显示当前帧率
  app.ticker.maxFPS = 0;
  const fpsEl = document.getElementById('fps');
  app.ticker.add(() => {
    if (fpsEl.style.display !== 'none')
      fpsEl.textContent = Math.round(app.ticker.FPS).toString();
  });

  const model = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
  model.anchor.set(0.5, 0.5);
  app.stage.addChild(model);

  // 16x 各向异性过滤：与原生版一致，修复 4096 图集在缩小/斜视角下唇线等
  // 细线在高 mip 层被采样成碎点/虚线的问题。
  // 注意：PIXI Texture 对象在 model.textures（from() 内部 Promise.all 加载后赋值），
  // 而 internalModel.textures 是 model3.json 里的贴图 URL 字符串数组，设了无效；
  // 属性挂在 baseTexture 上，且仅当 mipmap 开启（4096 为 2 的幂，AUTO 自动启用）
  // 且 scaleMode=LINEAR 时才会真正传给 GPU（EXT_texture_filter_anisotropic）。
  for (const t of (model.textures || [])) {
    try {
      const bt = t.baseTexture || t;
      bt.anisotropicLevel = 16;
      bt.update();
    } catch (_) { /* API 版本差异时忽略 */ }
  }

  // 表情与动作列表直接读模型自己的 model3.json（宿主导入时已把 exp3/motion3 登记进去），
  // 不依赖渲染库的内部字段：换模型后右键菜单里的「表情 / 动作」自动跟着变。
  let modelRefs = { expressions: [], motions: {} };
  try {
    const refs = (await (await fetch(MODEL_URL)).json()).FileReferences || {};
    modelRefs = { expressions: refs.Expressions || [], motions: refs.Motions || {} };
  } catch (_) { /* 读不到就不显示表情/动作分组 */ }

  // 水印开关：水印是模型里的独立部件（Id 由宿主按模型配置传入，如 "Part13"，cdi3.json 显示名"水印.png"）。
  // 每帧在参数提交前把该部件透明度压 0，等同于 VTube Studio"按空格关闭水印"的内置功能。
  if (WATERMARK_PART) {
    PIXI.Ticker.shared.add(() => {
      try { model.internalModel.coreModel.setPartOpacityById(WATERMARK_PART, 0); } catch (_) {}
    });
  }

  // 自动眨眼：待机动作是循环动作，每帧都会更新参数，框架内置的眨眼逻辑（仅在动作
  // 未更新参数时才触发）因此永远不会执行。这里挂到 beforeModelUpdate（各参数更新之后、
  // 计算顶点之前，与官方 SDK 的顺序一致）上强制驱动眨眼。
  const blink = model.internalModel;
  // 口型律动音量（0~1 开闭 / -1~1 水平宽窄）：宿主检测到 music 状态后推送。
  // 注意写的是物理输入参数（ParamMouthOpenY / ParamMouthForm），由物理演算带出
  // ParamMouthOpenY2 / ParamMouthForm2 驱动网格；直接写 Form2 会被物理结果覆盖。
  let lipValue = 0;
  let lipWide = 0;
  window.onHostSetLipSync = (v, w) => {
    lipValue = Math.max(0, Math.min(1, v));
    lipWide = Math.max(-1, Math.min(1, w || 0));
  };
  if (blink.eyeBlink && typeof blink.on === 'function') {
    blink.on('beforeModelUpdate', () => {
      blink.eyeBlink.updateParameters(blink.coreModel, PIXI.Ticker.shared.deltaMS / 1000);
      // 口型律动：每帧在参数更新后写入，音乐节奏驱动嘴部开合与横向扩张收缩
      try {
        blink.coreModel.setParameterValueById('ParamMouthOpenY', lipValue);
        blink.coreModel.setParameterValueById('ParamMouthForm', lipWide);
      } catch (_) {}
    });
  } else {
    console.warn('[pet] eye blink unavailable (missing EyeBlink group?)');
    // 眨眼不可用时仍尝试单独挂口型写入
    if (typeof blink.on === 'function') {
      blink.on('beforeModelUpdate', () => {
        try {
          blink.coreModel.setParameterValueById('ParamMouthOpenY', lipValue);
          blink.coreModel.setParameterValueById('ParamMouthForm', lipWide);
        } catch (_) {}
      });
    }
  }

  // 自适应窗口大小，模型居中偏下
  let fitScale = 1;
  let zoom = 1;
  function layout() {
    fitScale = Math.min(window.innerWidth / model.internalModel.width, window.innerHeight / model.internalModel.height) * 0.95;
    model.scale.set(fitScale * zoom);
    model.position.set(window.innerWidth / 2, window.innerHeight * 0.5);
  }
  layout();
  window.addEventListener('resize', layout);

  // 目光跟随基准 = 模型双眼中心（而不是画布/视图中心）。
  // pixi 的 model.focus(worldX, worldY) 内部以"画布中心"为原点算视线方向，
  // 这里先按 cdi3.json 的部件名定位眼睛部件，求出双眼中点在画布局部像素下的坐标，
  // 再把方向基准从画布中心换到双眼之间。
  let eyeLocal = null; // {x, y} 模型画布局部像素；null 表示未测到，退化为画布中心

  async function measureEyeCenter() {
    try {
      const im = model.internalModel;
      // Cubism Core 把几何数据放在数据字段里（而非 getter 方法）：
      // drawables.parentPartIndices[i] 是第 i 个 drawable 所属部件的索引，parts.ids 是部件 ID 列表。
      const core = (im.coreModel && typeof im.coreModel.getModel === 'function')
        ? im.coreModel.getModel() : null;
      const dd = core && core.drawables;
      const rp = core && core.parts;
      if (!dd || !rp || !rp.ids || !dd.parentPartIndices) {
        console.warn('[pet] drawable-part mapping unavailable, gaze falls back to canvas center');
        return;
      }

      // 顶点数据要等模型完成第一帧 update 后才有效；否则全是 0，会退化成画布中心
      await new Promise((resolve) => PIXI.Ticker.shared.addOnce(resolve));

      // cdi3.json 的 Parts[].{Id,Name} 提供部件 ID 到显示名的映射
      const names = new Map();
      try {
        const res = await fetch(CDI_URL);
        const json = await res.json();
        for (const p of (json.Parts || [])) names.set(p.Id, p.Name);
      } catch (_) { /* 读不到就退化为画布中心 */ }

      // 眼睛部件按显示名识别：名称含"眼"即可（本模型为 "←眼"/"→眼"），
      // 但排除"眼镜"/"眼罩"/"眼泪"等干扰项；先求每个部件顶点均值，再对部件中心取平均。
      const isEye = (name) => name && name.includes('眼')
        && !name.includes('镜') && !name.includes('罩') && !name.includes('泪');
      const parts = new Map();
      for (let i = 0; i < dd.count; i++) {
        const name = names.get(rp.ids[dd.parentPartIndices[i]]);
        if (!isEye(name)) continue;

        const v = im.getDrawableVertices(i); // 画布局部像素（原点左上、y 向下）
        if (!v || v.length < 2) continue;
        let cx = 0, cy = 0;
        for (let k = 0; k < v.length; k += 2) { cx += v[k]; cy += v[k + 1]; }
        const n = v.length / 2;
        const acc = parts.get(name) || { x: 0, y: 0, n: 0 };
        parts.set(name, { x: acc.x + cx / n, y: acc.y + cy / n, n: acc.n + 1 });
      }
      if (!parts.size) {
        console.warn('[pet] eye parts not found, gaze falls back to canvas center');
        return;
      }

      let sx = 0, sy = 0;
      for (const p of parts.values()) { sx += p.x / p.n; sy += p.y / p.n; }
      eyeLocal = { x: sx / parts.size, y: sy / parts.size };
      console.log('[pet] eye center local px =', eyeLocal,
        'canvas =', im.originalWidth, 'x', im.originalHeight, 'parts =', parts.size);
    } catch (e) {
      console.warn('[pet] measureEyeCenter failed', e);
    }
  }

  // 视线跟随：世界坐标 -> 画布局部坐标，再以双眼中心为原点求方向
  let gazeEnabled = true;   // 目光跟随开关（宿主托盘勾选项），关闭后 lookAt 直接忽略
  const tempLook = new PIXI.Point();
  function lookAt(worldX, worldY) {
    if (!gazeEnabled) return;
    const im = model.internalModel;
    tempLook.x = worldX;
    tempLook.y = worldY;
    model.toModelPosition(tempLook, tempLook);
    const ox = eyeLocal ? eyeLocal.x : im.originalWidth / 2;
    const oy = eyeLocal ? eyeLocal.y : im.originalHeight / 2;
    const tx = (tempLook.x - ox) * 2 / im.originalWidth;
    const ty = (tempLook.y - oy) * 2 / im.originalHeight;
    const radian = Math.atan2(ty, tx);
    im.focusController.focus(Math.cos(radian), -Math.sin(radian));
  }

  await measureEyeCenter();

  // 视线跟随鼠标（窗口内）
  app.stage.on('pointermove', (e) => {
    const p = e.data ? e.data.global : e.global;
    lookAt(p.x, p.y);
  });

  // 宿主托盘"目光跟随"开关：关闭时 focus(0,0) 回正并让后续 lookAt 失效，
  // 开启时恢复跟随（下一次光标坐标到达即重新看向光标）
  window.onHostSetGazeFollow = (enabled) => {
    gazeEnabled = !!enabled;
    if (!gazeEnabled) model.internalModel.focusController.focus(0, 0);
  };

  // 宿主托盘"显示帧率"开关：控制右上角叠加层显隐
  window.onHostSetFpsVisible = (visible) => {
    fpsEl.style.display = visible ? 'block' : 'none';
  };

  // 显示器电源（宿主注册 WM_POWERBROADCAST → GUID_CONSOLE_DISPLAY_STATE）：
  // 关屏期间停掉 app.ticker（驱动渲染与模型内部 update）与 Ticker.shared（驱动
  // 模型参数累积、水印部件压制），页面完全不绘制、不推进模型；亮屏恢复。
  // pixi 的 deltaMS 有 100ms 上限，恢复时首帧不会时间跳变。
  // 若该指令到达早于 ready（模型加载中），宿主会在收到 ready 后重放状态，
  // 保证最终停在正确的电源状态。
  window.onHostSetRenderPause = (paused) => {
    try {
      if (paused) { app.ticker.stop(); PIXI.Ticker.shared.stop(); }
      else { app.ticker.start(); PIXI.Ticker.shared.start(); }
    } catch (_) { /* 尚未初始化时忽略，ready 重放兜底 */ }
    // 回执：把实际生效的 ticker 状态报给宿主，便于日志确认停/恢复已执行
    tellHost({ type: 'renderpause', paused: !!paused, app: app.ticker.started, shared: PIXI.Ticker.shared.started });
  };

  // 宿主托盘菜单"重置模型大小和位置"：缩放回 1，再按窗口重新居中
  window.onHostResetModel = () => { zoom = 1; layout(); };

  // 中键拖拽：移动模型在窗口内的位置（不移动窗口）。只按位移更新，
  // 纯中键单击不做任何事，与宿主原生版行为一致。
  let modelDrag = null;
  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 1) return;             // 只处理中键
    e.preventDefault();                      // 抑制中键默认行为（滚动/粘贴）
    modelDrag = { x: e.clientX, y: e.clientY };
    // 指针捕获：光标拖出窗口后仍能收到移动/抬起事件
    try { e.target.setPointerCapture?.(e.pointerId); } catch (_) {}
  });
  document.addEventListener('pointermove', (e) => {
    if (!modelDrag) return;
    model.position.set(
      model.position.x + (e.clientX - modelDrag.x),
      model.position.y + (e.clientY - modelDrag.y));
    modelDrag = { x: e.clientX, y: e.clientY };
  });
  const endModelDrag = () => { modelDrag = null; };
  document.addEventListener('pointerup', endModelDrag);
  document.addEventListener('pointercancel', endModelDrag);

  // 右键交互菜单：页面内 HTML 菜单，与原生版的 MenuFlyout 对齐。
  // 只有压在模型上时窗口才可交互（其余位置点击穿透到下层应用），
  // 因此菜单也只在模型上右键时弹出。
  let menuOpen = false;
  const menuEl = document.getElementById('menu');
  function hideMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    menuEl.style.display = 'none';
    lastHit = null;                 // 置空让下一次命中检测重新上报，恢复按模型命中判穿透
  }
  function showMenu(x, y) {
    buildMenu();                    // 每次弹出前重建：勾选状态与列表都可能已变
    menuEl.style.display = 'block';
    // 贴边时夹回窗口内，避免菜单被裁掉
    const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
    menuEl.style.left = Math.max(0, Math.min(x, window.innerWidth - w - 4)) + 'px';
    menuEl.style.top = Math.max(0, Math.min(y, window.innerHeight - h - 4)) + 'px';
    menuOpen = true;
    tellHost({ type: 'hit', value: true }); // 菜单打开期间保持窗口可交互（否则光标移到菜单上会被判穿透）
  }

  // 动作平铺成一行一项：单动作组显示组名，多动作组显示「组名 · 文件名」，不嵌套子菜单
  function motionEntries() {
    const entries = [];
    for (const group of Object.keys(modelRefs.motions)) {
      const list = modelRefs.motions[group] || [];
      list.forEach((m, i) => {
        const file = String(m.File || '').split('/').pop().replace(/\.motion3\.json$/, '');
        entries.push({ group, index: i, text: list.length > 1 ? `${group} · ${file}` : group });
      });
    }
    return entries;
  }

  // 菜单项：戳一戳 / 摸摸头 = 先播反应动作/表情，再通知宿主发起一轮对话唤醒桌宠（先做反应再对话）；
  // 切换模型 = 模型列表由宿主传入，点击后由宿主更新下标并重开页面（模型与菜单按新参数重建）；
  // 表情 / 动作 = 在当前模型上直接切换，表情用 ●/○ 标出当前生效项
  function buildMenu() {
    menuEl.textContent = '';
    addItem('戳一戳', pokePet);
    addItem('摸摸头', patHead);
    MODELS.forEach((name, i) => {
      addItem((i === ACTIVE_MODEL ? '● ' : '○ ') + name,
        () => tellHost({ type: 'switchModel', index: i }));
    });

    const expressions = modelRefs.expressions.map((e) => e.Name).filter(Boolean);
    if (expressions.length) {
      addHeader('表情');
      addItem('清除表情', clearExpressions);
      for (const name of expressions) {
        addItem((manualActive.has(name) ? '● ' : '○ ') + name,
          () => toggleExpression(name));
      }
    }

    const motions = motionEntries();
    if (motions.length) {
      addHeader('动作');
      addItem('清除动作', resetMotion);
      for (const m of motions) addItem(m.text, () => playMotion(m.group, m.index));
    }

    function addItem(text, action) {
      const d = document.createElement('div');
      d.className = 'item';
      d.textContent = text;
      // 阻止冒泡：菜单项上的按下/抬起不参与左键拖窗与单击判定
      d.addEventListener('pointerdown', (e) => e.stopPropagation());
      d.addEventListener('click', (e) => { e.stopPropagation(); hideMenu(); action(); });
      menuEl.appendChild(d);
    }
    function addHeader(text) {
      const d = document.createElement('div');
      d.className = 'header';
      d.textContent = text;
      d.addEventListener('pointerdown', (e) => e.stopPropagation());
      menuEl.appendChild(d);
    }
  }

  // 右键：弹出交互菜单（抑制默认菜单）
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showMenu(e.clientX, e.clientY);
  });
  window.addEventListener('blur', hideMenu);   // 失焦（点了别的窗口）自动收起

  // 左键：按住移动 >6px → 通知宿主进入系统级拖窗（拖拽全程交给 Windows）；
  // 未产生位移的单击 → 呼出 / 收起对话窗口（与原生版左键单击一致）
  let leftPress = null;
  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (menuOpen) { hideMenu(); return; }   // 菜单打开时先收起菜单，本次点击不再触发拖窗/单击
    leftPress = { x: e.clientX, y: e.clientY, dragged: false };
  });
  document.addEventListener('pointermove', (e) => {
    if (!leftPress || leftPress.dragged) return;
    const dx = e.clientX - leftPress.x, dy = e.clientY - leftPress.y;
    if (dx * dx + dy * dy < 36) return;     // 位移 < 6px 不算拖拽
    leftPress.dragged = true;
    tellHost({ type: 'drag' });             // 进入系统拖拽模态
  });
  const endLeftPress = (e) => {
    if (e.button !== 0 || !leftPress) return;
    const click = !leftPress.dragged;
    leftPress = null;
    if (click) tellHost({ type: 'chat' });  // 单击 = 呼出 / 收起对话窗口
    // 鼠标抬起后补发一次当前命中状态：按住期间宿主保持非穿透，
    // 松开后需要按最新命中结果重新应用穿透
    if (lastHit !== null) tellHost({ type: 'hit', value: lastHit });
  };
  document.addEventListener('pointerup', endLeftPress);
  document.addEventListener('pointercancel', (e) => { leftPress = null; });

  // 命中检测：每帧读光标下 1 个像素的 alpha，>=32 判定压在模型可见区域上；
  // 状态变化时通知宿主，宿主据此切换 WS_EX_TRANSPARENT 实现点击穿透
  // （鼠标不在模型上时点击落到下层应用，与原生版 ProbeCursorPixel 逻辑一致）。
  // 依赖 preserveDrawingBuffer，否则读到的是已清空的缓冲（全透明）。
  const gl = app.view.getContext('webgl2') || app.view.getContext('webgl');
  const hitPixel = new Uint8Array(4);
  let lastHit = null;                       // 最近一次上报宿主的命中状态
  let mouseCssX = -1e4, mouseCssY = -1e4;   // 光标 CSS 像素坐标（页面内 + 宿主全局轮询共用）

  // 光标移出窗口后页面收不到 pointermove，由宿主全局轮询转发坐标补上，
  // 命中检测也用同一份坐标（窗口外坐标为负/越界，直接判未命中）
  window.onHostCursor = (x, y) => { mouseCssX = x; mouseCssY = y; lookAt(x, y); };
  document.addEventListener('pointermove', (e) => { mouseCssX = e.clientX; mouseCssY = e.clientY; });

  function probePointer() {
    if (!gl) return;
    const w = app.view.width, h = app.view.height;
    if (!w || !h) return;
    const res = app.renderer.resolution || 1;
    const rx = Math.floor(mouseCssX * res);
    const ry = Math.floor(mouseCssY * res);
    let hit = false;
    if (rx >= 0 && ry >= 0 && rx < w && ry < h) {
      // glReadPixels 原点在左下，页面坐标 y 向下，需翻转
      gl.readPixels(rx, h - ry - 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, hitPixel);
      hit = hitPixel[3] >= 32;
    }
    // 菜单打开期间强制判为命中：菜单是 HTML 层（不在 WebGL 帧缓冲里），
    // 否则光标移到菜单上会读到模型像素为透明而误判穿透，菜单点不动
    if (menuOpen) hit = true;
    if (hit !== lastHit) {
      lastHit = hit;
      tellHost({ type: 'hit', value: hit });
    }
  }
  PIXI.Ticker.shared.add(probePointer);

  // 滚轮缩放
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom = Math.min(3, Math.max(0.4, zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    model.scale.set(fitScale * zoom);
  }, { passive: false });

  // 表情：由自动联动或"戳一戳"菜单设置（左键单击已改为呼出对话窗口）。
  // 手柄显示中（padOn：游戏联动命中或托盘"常显手柄"）不改表情——
  // 表情是替换制，点走手柄表情后没有任何机制切回来。
  let curExpr = null;                 // 当前手动设置的表情名
  let autoExpr = null;                // 自动表情联动设置的表情名（null = 无）

  async function setExpr(name) {
    const em = model.internalModel.motionManager.expressionManager;
    // 自动 / 外部指定的单个表情接管：立即清掉手动多选，避免两套表情叠在同一批参数上
    manualActive.clear();
    manualWeights.clear();
    manualExprs.length = 0;
    // 传名字就切换到该表情（重复点同一项保持不动），传 null 清除回默认
    if (name) {
      await model.expression(name);
      curExpr = name;
    } else {
      if (em) em.resetExpression();
      curExpr = null;
    }
    tellHost({ type: 'expression', name: curExpr });   // 回报实际表情，供宿主查询当前表情
  }

  // 手动切换动作：优先级 3（Force）立即接管当前动作，与原生版 PlayMotion 一致；
  // 组名/序号无效时渲染库内部会抛错，这里吞掉即可
  function playMotion(group, index) {
    try {
      // motion() 返回 Promise，失败（无效组/序号）会 reject 而不是同步抛错
      const p = model.motion(group, index, 3);
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (_) { /* 无效组/序号时忽略 */ }
  }

  // 清除动作并恢复默认状态：非循环动作播完会把参数留在末帧（换姿势、变装等），
  // 停掉动作后把参数逐个写回默认值并保存为基线，与原生版 ResetMotion 一致
  function resetMotion() {
    try {
      const im = model.internalModel;
      im.motionManager.stopAllMotions();
      const core = im.coreModel;
      const count = core.getParameterCount();
      for (let i = 0; i < count; i++) {
        core.setParameterValueByIndex(i, core.getParameterDefaultValue(i));
      }
      core.saveParameters();
    } catch (_) { /* 参数接口不可用时忽略 */ }
  }

  // 手动表情（多选叠加，带淡入淡出）：渲染库的表情队列是替换式的，多选时页面自己按 Blend 规则
  // 逐帧写回；每个表情有独立权重，激活时淡入、取消时淡出，与原生版一致。
  const EXPR_FADE_SECONDS = 0.3;
  const manualExprs = [];              // 激活顺序（含正在淡出的）
  const manualActive = new Set();      // 目标为激活的集合
  const manualWeights = new Map();     // 表情名 → 当前权重（0~1）
  const manualExprDefs = new Map();    // 表情名 → 参数定义（异步读 exp3.json 后缓存）

  async function loadExpressionDefs(name) {
    if (manualExprDefs.has(name)) return manualExprDefs.get(name);
    const entry = modelRefs.expressions.find((e) => e.Name === name);
    if (!entry || !entry.File) return [];
    try {
      const dir = MODEL_URL.replace(/[^/]*$/, '');
      const json = await (await fetch(dir + entry.File)).json();
      const defs = (json.Parameters || []).map((p) => ({
        id: p.Id, value: Number(p.Value) || 0, blend: p.Blend || 'Add',
      }));
      manualExprDefs.set(name, defs);
      return defs;
    } catch (_) { return []; }
  }

  // 把手动表情按权重叠加到当前参数上（挂在 beforeModelUpdate：动作/物理之后、顶点计算之前）。
  // 权重逐帧向目标逼近，因此切换表情是平滑过渡而不是瞬间跳变。
  function applyManualExprs() {
    if (!manualExprs.length) return;
    try {
      const core = blink.coreModel;
      const step = Math.min(0.5, (PIXI.Ticker.shared.deltaMS || 0) / 1000) / EXPR_FADE_SECONDS;
      for (let i = manualExprs.length - 1; i >= 0; i--) {
        const name = manualExprs[i];
        const target = manualActive.has(name) ? 1 : 0;
        let w = manualWeights.get(name) || 0;
        w = target > w ? Math.min(target, w + step) : Math.max(target, w - step);
        manualWeights.set(name, w);
        // 淡出结束：从列表里摘掉，不再影响参数
        if (w <= 0 && target === 0) {
          manualWeights.delete(name);
          manualExprs.splice(i, 1);
          continue;
        }

        const defs = manualExprDefs.get(name);
        if (!defs) { loadExpressionDefs(name); continue; }   // 还没读完：下一帧再叠
        for (const p of defs) {
          const cur = core.getParameterValueById(p.id);
          // 与 SDK 的权重语义一致：Add 按权重加、Multiply 按权重插值、Overwrite 按权重覆盖
          const v = p.blend === 'Multiply' ? cur * (1 + (p.value - 1) * w)
                  : p.blend === 'Overwrite' ? cur + (p.value - cur) * w
                  : cur + p.value * w;
          core.setParameterValueById(p.id, v);
        }
      }
    } catch (_) { /* 参数接口不可用时忽略 */ }
  }
  blink.on('beforeModelUpdate', applyManualExprs);

  // 切换某个表情的手动激活状态：多选同时生效，点已激活项即取消（淡出）
  async function toggleExpression(name) {
    if (manualActive.has(name)) {
      manualActive.delete(name);      // 保留在列表里，等权重降到 0 再移除
    } else {
      manualActive.add(name);
      if (!manualWeights.has(name)) manualWeights.set(name, 0);
      if (!manualExprs.includes(name)) manualExprs.push(name);
      await loadExpressionDefs(name);
    }

    // 手动接管：停掉渲染库的表情队列，避免自动表情残留叠在手动表情上
    const em = model.internalModel.motionManager.expressionManager;
    if (em) em.stopAllExpressions();
    curExpr = null;
    tellHost({ type: 'expression', name: null });
  }

  function clearExpressions() {
    manualActive.clear();             // 已激活的表情自然淡出
    const em = model.internalModel.motionManager.expressionManager;
    if (em) em.stopAllExpressions();
    curExpr = null;
    tellHost({ type: 'expression', name: null });
  }

  // 戳一戳的表情：随机取一个（与原生版 SetRandomExpression 一致），经 setExpr 保证上报宿主
  function randomExpression() {
    if (padOn) return;              // 手柄显示中不改表情（与原生版一致）
    autoExpr = null;                // 手动接管：清掉自动锁定
    setExpr(EXPRESSIONS[Math.floor(Math.random() * EXPRESSIONS.length)]);
  }

  // 戳一戳：先播被戳反应动作/表情，再通知宿主发起一轮对话唤醒桌宠。
  // TapBody 动作组由模型定义（本模型 group 名即 "TapBody"）；不存在时静默忽略。
  function pokePet() {
    randomExpression();
    try { model.motion('TapBody'); } catch (_) { /* 无该动作组时忽略 */ }
    tellHost({ type: 'poke' });
  }

  // 摸摸头：先播摸头反应动作/表情，再通知宿主发起一轮对话（与戳一戳同流程）。
  // TapHead 动作组由模型定义；不存在时静默忽略，只换表情。
  function patHead() {
    randomExpression();
    try { model.motion('TapHead'); } catch (_) { /* 无该动作组时忽略 */ }
    tellHost({ type: 'pat' });
  }

  // 手柄联动：宿主把手柄（或 WASD + 鼠标）输入推给页面，写入模型 ParamGroup3「手柄」的
  // 摇杆与按键参数。写入挂在 beforeModelUpdate（各参数更新之后、顶点计算之前），
  // 这样物理演算（physics3.json 把摇杆/按键当输入源）能随即带出身体与手臂的晃动。
  // 宿主 30Hz 推送、页面 60fps 渲染，中间做指数逼近避免台阶感。
  // 参数索引在首次驱动时构建一次，只写确实存在的参数（换模型也不会抛错）。
  let padOn = false;                      // 驱动开关（游戏命中或手动开启时宿主置 true）
  const pad = { lx: 0, ly: 0, rx: 0, ry: 0, lt: 0, rt: 0, dx: 0, dy: 0, mask: 0 };   // 目标值
  const padCur = { lx: 0, ly: 0, rx: 0, ry: 0, lt: 0, rt: 0 };                       // 平滑后的当前值
  const PAD_AXES = ['LStickX', 'LStickY', 'RStickX', 'RStickY', 'LTrigger', 'RTrigger'];
  const PAD_AXIS_KEYS = ['lx', 'ly', 'rx', 'ry', 'lt', 'rt'];
  const PAD_BUTTONS = ['ButtonA', 'ButtonB', 'ButtonX', 'ButtonY',
                       'LShoulder', 'RShoulder', 'LStickButton', 'RStickButton'];

  // 参数 id → 索引映射：coreModel 支持 getParameterIndex 时预建，写入走按索引的
  // setParameterValueByIndex（省掉每帧的字符串查找，也更贴近 wasm 原生 API）。
  // 不支持的实现回退 setParameterValueById；索引 -1（参数不存在）一律跳过。
  let padIdx = null;
  function buildPadIndex() {
    try {
      const core = blink.coreModel;
      if (typeof core.getParameterIndex !== 'function') { padIdx = null; return; }
      const map = {};
      for (const id of [...PAD_AXES, ...PAD_BUTTONS, 'DPadX', 'DPadY']) {
        const i = core.getParameterIndex(id);
        if (i >= 0) map[id] = i;
      }
      padIdx = map;
      console.log('[pet] gamepad params mapped:', Object.keys(map).length);
    } catch (_) { padIdx = null; }
  }

  function setPadParam(id, v) {
    try {
      if (padIdx && padIdx[id] !== undefined
          && typeof blink.coreModel.setParameterValueByIndex === 'function') {
        blink.coreModel.setParameterValueByIndex(padIdx[id], v);
      } else {
        blink.coreModel.setParameterValueById(id, v);
      }
    } catch (_) {}
  }

  window.onHostSetGamepadEnabled = (v) => {
    padOn = !!v;
    if (!padIdx && padOn) buildPadIndex();
    if (!padOn) {
      // 关闭驱动：参数回中，避免残留偏转（模型每帧会自行复位，这里写一次加速回中）
      for (const id of PAD_AXES) setPadParam(id, 0);
      for (const id of PAD_BUTTONS) setPadParam(id, 0);
      setPadParam('DPadX', 0);
      setPadParam('DPadY', 0);
      for (const k of PAD_AXIS_KEYS) padCur[k] = 0;
      for (const k of Object.keys(pad)) pad[k] = 0;
    }
  };
  window.onHostSetGamepad = (lx, ly, rx, ry, lt, rt, dx, dy, mask) => {
    pad.lx = lx; pad.ly = ly; pad.rx = rx; pad.ry = ry;
    pad.lt = lt; pad.rt = rt; pad.dx = dx; pad.dy = dy; pad.mask = mask | 0;
  };

  if (typeof blink.on === 'function') {
    blink.on('beforeModelUpdate', () => {
      if (!padOn) return;
      if (!padIdx) buildPadIndex();
      const k = 0.25;
      for (let i = 0; i < PAD_AXES.length; i++) {
        const key = PAD_AXIS_KEYS[i];
        padCur[key] += (pad[key] - padCur[key]) * k;
        setPadParam(PAD_AXES[i], padCur[key]);
      }
      for (let i = 0; i < PAD_BUTTONS.length; i++) {
        setPadParam(PAD_BUTTONS[i], (pad.mask & (1 << i)) ? 1 : 0);
      }
      setPadParam('DPadX', pad.dx);
      setPadParam('DPadY', pad.dy);
    });
  }

  // 自动表情联动（宿主检测到游戏/音乐应用后通过 InvokeScript 调用）：
  // 设置时切换对应表情，传 null 清除并恢复默认（无表情）
  window.onHostSetExpression = (name) => {
    autoExpr = name;
    setExpr(name);
  };
  window.onHostResetExpression = () => {
    autoExpr = null;
    setExpr(null);
  };

  // 通知宿主页面已就绪（模型加载完成），宿主据此重放此前缓存的自动表情状态
  tellHost({ type: 'ready' });
}

main().catch((e) => { console.error(e); showError('加载失败：' + e.message); });
</script>
</body>
</html>
